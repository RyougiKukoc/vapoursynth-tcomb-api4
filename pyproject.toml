[build-system]
requires = ["hatchling>=1.30", "packaging>=24.0", "meson>=0.49", "ninja"]
build-backend = "hatchling.build"

[project]
name = "vapoursynth-tcomb"
version = "4.3"
description = "TComb temporal comb VapourSynth plugin"
readme = "readme.rst"
license = { text = "GPL-2.0-or-later" }
license-files = ["gpl2.txt"]
requires-python = ">=3.12"
authors = [{ name = "TComb contributors" }]
dependencies = ["VapourSynth>=77"]

[project.urls]
"Source Code" = "https://github.com/RyougiKukoc/vapoursynth-tcomb-api4"
"Releases" = "https://github.com/RyougiKukoc/vapoursynth-tcomb-api4/releases"

[tool.hatch.build.targets.sdist]
include = [
  "autogen.sh",
  "configure.ac",
  "gpl2.txt",
  "hatch_build.py",
  "Makefile.am",
  "meson.build",
  "pyproject.toml",
  "readme.rst",
  "src",
  "tools",
]

[tool.hatch.build.targets.wheel]
include = ["vapoursynth/plugins"]
artifacts = [
  "vapoursynth/plugins/**/*.dll",
  "vapoursynth/plugins/**/*.so",
  "vapoursynth/plugins/**/*.dylib",
  "vapoursynth/plugins/**/manifest.vs",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
