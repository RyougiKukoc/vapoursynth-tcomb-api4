name: Build Windows

permissions:
  contents: write

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  msys2-ucrt64:
    name: Build MSYS2 UCRT64
    runs-on: windows-latest

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python tools and VapourSynth
        run: |
          python -m pip install --upgrade pip
          python -m pip install VapourSynth build hatchling packaging meson ninja

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Prepare VapourSynth pkg-config metadata
        run: |
          python tools/ci_prepare_vs_wheel.py

      - name: Build package
        run: |
          $env:PATH = "$env:GITHUB_WORKSPACE\_deps\vapoursynth-wheel-R77;C:\msys64\ucrt64\bin;C:\msys64\usr\bin;$env:PATH"
          $env:PKG_CONFIG_PATH = "$env:GITHUB_WORKSPACE\_deps\vapoursynth-wheel-R77\vapoursynth\lib\pkgconfig"
          $env:PKG_CONFIG = 'pkg-config'
          $env:TCOMB_FORCE_BUILD = '1'
          $env:CC = 'gcc'
          python tools/ci_build_windows.py --clean --wheel

      - name: Smoke test package directory
        run: |
          python tools/ci_smoke_package.py

      - name: Create release assets
        run: |
          python tools/ci_make_release_assets.py --clean

      - name: Smoke test release zip
        run: |
          python tools/ci_smoke_package.py --artifact-zip dist\release-assets\tcomb-msys2-ucrt64.zip

      - name: Install built wheel
        run: |
          $wheel = Get-ChildItem dist\wheels\*.whl | Select-Object -First 1 -ExpandProperty FullName
          if (-not $wheel) { throw 'built wheel not found under dist\wheels' }
          python -m pip install --force-reinstall --no-deps $wheel

      - name: Smoke test installed wheel
        run: |
          python tools/ci_smoke_installed_wheel.py

      - name: Smoke test source install with prebuilt release asset
        run: |
          python -m pip uninstall -y vapoursynth-tcomb
          $env:TCOMB_PREBUILT_URL = Join-Path $PWD 'dist\release-assets\tcomb-msys2-ucrt64.zip'
          Remove-Item Env:\TCOMB_FORCE_BUILD -ErrorAction SilentlyContinue
          python -m pip install --force-reinstall --no-deps --no-build-isolation -v .
          python tools/ci_smoke_installed_wheel.py

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcomb-msys2-ucrt64
          path: dist/msys2-ucrt64
          if-no-files-found: error

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcomb-wheel-win64
          path: dist/wheels
          if-no-files-found: error

      - name: Upload release assets artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcomb-release-assets
          path: dist/release-assets
          if-no-files-found: error

  linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Linux wheel and release payload
        shell: bash
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            quay.io/pypa/manylinux2014_x86_64 bash -lc '
              set -exo pipefail
              py=/opt/python/cp312-cp312/bin/python
              source /opt/rh/devtoolset-10/enable
              set -u
              export PATH="/opt/python/cp312-cp312/bin:$PATH"
              "$py" -m pip install --upgrade pip
              "$py" -m pip install build hatchling packaging meson ninja
              mkdir -p _deps/vapoursynth-wheel dist/wheels-linux dist/linux-x86_64
              "$py" -m pip download --only-binary=:all: --no-deps \
                --platform manylinux_2_27_x86_64 --implementation cp --python-version 312 --abi abi3 \
                VapourSynth -d _deps/vapoursynth-wheel
              unzip -q _deps/vapoursynth-wheel/*.whl -d _deps/vapoursynth-wheel/extracted
              export PKG_CONFIG_PATH="/workspace/_deps/vapoursynth-wheel/extracted/vapoursynth/pkgconfig"
              export TCOMB_FORCE_BUILD=1
              export TCOMB_PLATFORM_TAG=manylinux_2_27_x86_64
              "$py" -m build --wheel --no-isolation --outdir dist/wheels-linux
              wheel=$(find dist/wheels-linux -name "*.whl" -print -quit)
              test -n "$wheel"
              unzip -q "$wheel" "vapoursynth/plugins/tcomb/*" -d dist/linux-x86_64/extracted
              mv dist/linux-x86_64/extracted/vapoursynth/plugins/tcomb dist/linux-x86_64/tcomb
              "$py" tools/ci_make_release_assets.py --clean \
                --package-dir dist/linux-x86_64/tcomb --wheel-dir dist/wheels-linux \
                --out-dir dist/release-assets-linux --zip-name tcomb-linux-x86_64.zip
              "$py" -c "import re, subprocess; out = subprocess.check_output([\"readelf\", \"--version-info\", \"dist/linux-x86_64/tcomb/tcomb.so\"], text=True); versions = [tuple(map(int, value.split(\".\"))) for value in re.findall(r\"GLIBC_(\\d+\\.\\d+)\", out)]; assert all(version <= (2, 17) for version in versions), versions"
            '

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: tcomb-release-assets-linux
          path: dist/release-assets-linux
          if-no-files-found: error

  linux-runtime-smoke:
    name: Smoke Linux release payload
    needs: linux-x86_64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: tcomb-release-assets-linux
          path: dist/release-assets-linux

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and smoke test released wheel
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip VapourSynth
          python -m pip install --force-reinstall --no-deps dist/release-assets-linux/*.whl
          python tools/ci_smoke_installed_wheel.py

      - name: Smoke test source install with Linux release asset
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip uninstall -y vapoursynth-tcomb
          export TCOMB_PREBUILT_URL="$GITHUB_WORKSPACE/dist/release-assets-linux/tcomb-linux-x86_64.zip"
          python -m pip install --force-reinstall --no-deps -v .
          python tools/ci_smoke_installed_wheel.py

  publish-release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [msys2-ucrt64, linux-runtime-smoke]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tcomb-release-assets*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euxo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" release-assets/* --title "$tag" --notes "Automated release for $tag." --repo "$GITHUB_REPOSITORY"
          fi
